<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — OUTREPD</title>
  <meta name="theme-color" content="#FAF9F6">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/landing.css?v=4">
  <link rel="stylesheet" href="/pages.css?v=2">
  <script>
    // GitHub Pages has no server-side routing: an unknown path like
    // /u/mokhtar_y lands here instead of at u/index.html. Hand it the
    // username as a query param, which that page reads either way — the
    // pretty path still works, it just detours through here to get there.
    (function () {
      var match = location.pathname.match(/^\/u\/([^/]+)\/?$/i);
      if (match && match[1]) {
        location.replace('/u/?name=' + encodeURIComponent(match[1]));
      }
    })();
  </script>
</head>
