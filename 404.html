<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Page not found — OUTREPD</title>
  <meta name="theme-color" content="#121110">
  <meta name="robots" content="noindex, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/home.css?v=6">
  <link rel="stylesheet" href="/legal.css?v=1">
  <script>
    // GitHub Pages has no server-side routing: an unknown path like
    // /u/mokhtar_y lands here instead of at u/index.html. Hand it the
    // username as a query param, which that page reads either way — the
    // pretty path still works, it just detours through here to get there.
    (function () {
      var match = location.pathname.match(/^\/u\/([^/]+)\/?$/i);
      if (match && match[1]) {
        location.replace('/u/?name=' + encodeURIComponent(match[1]));
      }
    })();
  </script>
</head>
<body>
  <header class="nav" id="nav">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/favicon.png" alt="">OUTREPD</a>
      <nav class="nav__links" aria-label="Sections"><a href="/#how">How it works</a><a href="/#app">The app</a><a href="/#adventure">Adventure</a><a href="/#ranks">Ranks</a><a href="/#faq">FAQ</a></nav>
      <a class="btn" id="download" href="/#get">Download</a>
    </div>
  </header>

  <main class="notfound wrap">
    <p class="notfound__code">404</p>
    <h1 class="notfound__title">Page not found</h1>
    <p class="notfound__body">That link doesn't lead anywhere on OUTREPD.</p>
    <a class="btn" href="/">Back home</a>
  </main>

  <footer class="footer">
    <div class="wrap">
      <a class="brand" href="/"><img src="/assets/favicon.png" alt="">OUTREPD</a>
      <nav><a href="/privacy">Privacy Policy</a><a href="/terms">Terms of Service</a><a href="/contact">Contact</a></nav>
      <span>&copy; 2026 OUTREPD</span>
    </div>
  </footer>
  <script>
    (function () {
      var nav = document.getElementById('nav');
      function solid() { nav.classList.toggle('is-solid', window.scrollY > 24); }
      window.addEventListener('scroll', solid, { passive: true });
      solid();
      // "On this page", from the page's own headings.
      var toc = document.querySelector('.toc');
      if (!toc) return;
      var heads = [].slice.call(document.querySelectorAll('.legal__body h2'));
      if (heads.length < 3) return;
      toc.innerHTML = '<b>On this page</b>';
      heads.forEach(function (h, i) {
        if (!h.id) h.id = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 's' + i;
        var a = document.createElement('a');
        a.href = '#' + h.id;
        a.textContent = h.textContent;
        toc.appendChild(a);
      });
      toc.hidden = false;
      var links = toc.querySelectorAll('a');
      function spy() {
        var at = 0;
        heads.forEach(function (h, i) { if (h.getBoundingClientRect().top < 140) at = i; });
        links.forEach(function (a, i) { a.classList.toggle('is-here', i === at); });
      }
      window.addEventListener('scroll', spy, { passive: true });
      spy();
    })();
  </script>
</body>
</html>
